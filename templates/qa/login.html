{% extends 'qa/base.html' %}
{% block title %}Login — RV Systems{% endblock %}

{% block content %}
<div class="d-flex align-items-center justify-content-center mt-4" 
     style="min-height: 80vh;">
  <div class="col-md-5 col-lg-4 col-11">
    <div class="card p-4 p-md-5">

      <div class="text-center mb-4">
        <div class="d-inline-flex align-items-center justify-content-center
                    bg-primary bg-opacity-10 rounded-circle mb-3"
             style="width:68px; height:68px;">
          <i class="bi bi-lightning-charge-fill text-primary fs-2"></i>
        </div>
        <h3 class="fw-bold mb-1">Welcome Back</h3>
        <p class="text-muted small mb-0">Login to your ElectraQ account</p>
      </div>

      <form method="post">
        {% csrf_token %}

        <div class="mb-3">
          <label class="form-label fw-semibold small text-secondary">
            Username
          </label>
          <input type="text" 
                 name="username"
                 class="form-control form-control-lg"
                 style="border-radius:10px; border:2px solid #e0e7ff;"
                 placeholder="Enter your username"
                 autofocus>
        </div>

        <div class="mb-4">
          <label class="form-label fw-semibold small text-secondary">
            Password
          </label>
          <input type="password" 
                 name="password"
                 class="form-control form-control-lg"
                 style="border-radius:10px; border:2px solid #e0e7ff;"
                 placeholder="Enter your password">
        </div>

        {% for error in form.non_field_errors %}
          <div class="alert alert-danger py-2 small rounded-3 mb-3">
            <i class="bi bi-exclamation-circle me-1"></i>{{ error }}
          </div>
        {% endfor %}

        <button type="submit" 
                class="btn btn-primary w-100 py-2 fw-bold"
                style="font-size:1rem; border-radius:10px;">
          <i class="bi bi-box-arrow-in-right me-2"></i>Login
        </button>
      </form>

      <hr class="my-4">
      <p class="text-center mb-0 small">
        No account yet? 
        <a href="{% url 'register' %}" class="fw-bold text-primary">
          Register free
        </a>
      </p>

    </div>
  </div>
</div>
{% endblock %}
